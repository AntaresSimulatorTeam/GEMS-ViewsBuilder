# Components of the legacy study, with the ids Antares gives them in the simulation tables.
# The ViewsBuilder only reads ids, models, properties and connections: parameters are omitted.
system:
  id: two_areas

  components:
    - id: fr_node
      model: antares_legacy_models.area
      properties:
        - {id: carrier, value: electricity}
    - id: be_node
      model: antares_legacy_models.area
      properties:
        - {id: carrier, value: electricity}

    - id: fr_load
      model: antares_legacy_models.load
      properties:
        - {id: carrier, value: electricity}
    - id: be_load
      model: antares_legacy_models.load
      properties:
        - {id: carrier, value: electricity}

    - id: fr_thermal_nuclear
      model: antares_legacy_models.thermal
      properties:
        - {id: carrier, value: electricity}
        - {id: technology, value: nuclear}
        - {id: name, value: nuclear}
    - id: fr_thermal_ccgt
      model: antares_legacy_models.thermal
      properties:
        - {id: carrier, value: electricity}
        - {id: technology, value: gas}
        - {id: name, value: ccgt}
    - id: be_thermal_ccgt
      model: antares_legacy_models.thermal
      properties:
        - {id: carrier, value: electricity}
        - {id: technology, value: gas}
        - {id: name, value: ccgt}
    - id: be_thermal_oil_peaker
      model: antares_legacy_models.thermal
      properties:
        - {id: carrier, value: electricity}
        - {id: technology, value: oil}
        - {id: name, value: oil_peaker}

    - id: fr_renewable_wind_onshore
      model: antares_legacy_models.renewable
      properties:
        - {id: carrier, value: electricity}
        - {id: technology, value: wind onshore}
    - id: fr_renewable_solar_pv
      model: antares_legacy_models.renewable
      properties:
        - {id: carrier, value: electricity}
        - {id: technology, value: solar pv}
    - id: be_renewable_wind_offshore
      model: antares_legacy_models.renewable
      properties:
        - {id: carrier, value: electricity}
        - {id: technology, value: wind offshore}
    - id: be_renewable_solar_pv
      model: antares_legacy_models.renewable
      properties:
        - {id: carrier, value: electricity}
        - {id: technology, value: solar pv}

    - id: be_short_term_storage_battery
      model: antares_legacy_models.short_term_storage
      properties:
        - {id: carrier, value: electricity}
        - {id: group, value: battery}
        - {id: name, value: battery}

    - id: be_fr_link
      model: antares_legacy_models.link
      properties:
        - {id: carrier, value: electricity}

  connections:
    - {component1: fr_load, port1: balance_port, component2: fr_node, port2: balance_port}
    - {component1: be_load, port1: balance_port, component2: be_node, port2: balance_port}
    - {component1: fr_thermal_nuclear, port1: balance_port, component2: fr_node, port2: balance_port}
    - {component1: fr_thermal_ccgt, port1: balance_port, component2: fr_node, port2: balance_port}
    - {component1: be_thermal_ccgt, port1: balance_port, component2: be_node, port2: balance_port}
    - {component1: be_thermal_oil_peaker, port1: balance_port, component2: be_node, port2: balance_port}
    - {component1: fr_renewable_wind_onshore, port1: balance_port, component2: fr_node, port2: balance_port}
    - {component1: fr_renewable_solar_pv, port1: balance_port, component2: fr_node, port2: balance_port}
    - {component1: be_renewable_wind_offshore, port1: balance_port, component2: be_node, port2: balance_port}
    - {component1: be_renewable_solar_pv, port1: balance_port, component2: be_node, port2: balance_port}
    - {component1: be_short_term_storage_battery, port1: balance_port, component2: be_node, port2: balance_port}
    # A positive flow goes from be (in_port side) to fr (out_port side).
    - {component1: be_fr_link, port1: in_port, component2: be_node, port2: balance_port}
    - {component1: be_fr_link, port1: out_port, component2: fr_node, port2: balance_port}
