view:
  id: view_storage

  scope:
    location:
      taxonomy-category: balance  # one location per area node

  taxonomy: antares_legacy_taxonomy

  aggregations-patterns:
    - id: hourly_per_scenario
      time-granularity: hour
      scenario: false
    - id: daily_all_scenario
      time-granularity: day
      scenario: true

  metrics:
    - id: antares_legacy_short_term_storage_catalog.P_INJECTION
    - id: antares_legacy_short_term_storage_catalog.P_WITHDRAWAL
    - id: antares_legacy_short_term_storage_catalog.LEVELS
    - id: antares_legacy_short_term_storage_catalog.CASHFLOW
