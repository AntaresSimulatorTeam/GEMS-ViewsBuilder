# Weekly check for a new stable GemsPy release on PyPI.
# When the latest release is newer than the `gemspy==X.Y.Z` pin in pyproject.toml,
# open a tracking issue, run the tests against the new version and post the results on the issue.

name: Check GemsPy Update

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  check-update:
    runs-on: ubuntu-22.04
    outputs:
      latest_version: ${{ steps.versions.outputs.latest }}
      issue_number: ${{ steps.create_issue.outputs.issue_number }}
      new_issue: ${{ steps.create_issue.outputs.new_issue }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Compare pinned and latest GemsPy versions
        id: versions
        run: |
          uv run --no-project --python 3.11 --with packaging python - <<'EOF'
          import json
          import os
          import tomllib
          import urllib.request

          from packaging.requirements import Requirement
          from packaging.utils import canonicalize_name
          from packaging.version import Version

          with open("pyproject.toml", "rb") as f:
              dependencies = tomllib.load(f)["project"]["dependencies"]

          pins = [
              spec.version
              for requirement in map(Requirement, dependencies)
              if canonicalize_name(requirement.name) == "gemspy"
              for spec in requirement.specifier
              if spec.operator == "=="
          ]
          if len(pins) != 1:
              raise SystemExit("ERROR: expected exactly one 'gemspy==X.Y.Z' pin in pyproject.toml")
          current = Version(pins[0])

          with urllib.request.urlopen("https://pypi.org/pypi/gemspy/json", timeout=30) as response:
              releases = json.load(response)["releases"]

          # Latest stable release: skip pre-releases, dev releases and fully yanked releases
          stable = [
              Version(version)
              for version, files in releases.items()
              if files and not all(file["yanked"] for file in files) and not Version(version).is_prerelease
          ]
          if not stable:
              raise SystemExit("ERROR: no stable GemsPy release found on PyPI")
          latest = max(stable)

          print(f"Pinned version: {current}  |  Latest version: {latest}")
          print("New version detected." if latest > current else "Already up to date.")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"current={current}\n")
              output.write(f"latest={latest}\n")
              output.write(f"update={str(latest > current).lower()}\n")
          EOF

      - name: Create GitHub Issue
        id: create_issue
        if: steps.versions.outputs.update == 'true'
        uses: actions/github-script@v9
        env:
          CURRENT_VERSION: ${{ steps.versions.outputs.current }}
          LATEST_VERSION: ${{ steps.versions.outputs.latest }}
        with:
          script: |
            const latest = process.env.LATEST_VERSION;
            const current = process.env.CURRENT_VERSION;
            const title = `GemsPy v${latest} detected - validation required`;

            // Look at closed issues too, so that a rejected version is not reported again every week
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100,
            });
            const duplicate = issues.find(i => !i.pull_request && i.title.includes(`GemsPy v${latest} `));
            if (duplicate) {
              console.log(`Issue already exists: #${duplicate.number} (${duplicate.state}) - skipping.`);
              core.setOutput('issue_number', String(duplicate.number));
              core.setOutput('new_issue', 'false');
              return;
            }

            let releaseUrl = 'https://github.com/AntaresSimulatorTeam/GemsPy/releases';
            let releaseNotes = '_Could not fetch release notes._';
            for (const tag of [`v${latest}`, latest]) {
              try {
                const release = await github.rest.repos.getReleaseByTag({
                  owner: 'AntaresSimulatorTeam',
                  repo: 'GemsPy',
                  tag: tag,
                });
                releaseUrl = release.data.html_url;
                releaseNotes = release.data.body || '_No release notes provided._';
                break;
              } catch (e) {
                console.log(`Could not fetch release notes for tag ${tag}: ${e.message}`);
              }
            }

            const body = [
              '## New Version Detected',
              '',
              'A new version of GemsPy has been published on PyPI.',
              '',
              '| | |',
              '|---|---|',
              `| **Pinned version** | \`${current}\` |`,
              `| **New version** | \`${latest}\` |`,
              `| **PyPI page** | https://pypi.org/project/gemspy/${latest}/ |`,
              `| **Release page** | ${releaseUrl} |`,
              '',
              'This issue tracks validation and integration into GEMS-ViewsBuilder.',
              'Test results against the new version are posted below as a comment.',
              '',
              '---',
              '',
              '## Release Notes',
              '',
              releaseNotes,
              '',
              '---',
              '',
              '## Tasks',
              '',
              '### Validation',
              '- [ ] Release notes reviewed',
              '- [ ] Tests and type checking pass against the new version (see comment below)',
              '- [ ] Library and system loading through GemsPy still behave as expected',
              '',
              '### Compatibility',
              '- [ ] Identify breaking changes in the GemsPy API used by GEMS-ViewsBuilder',
              '- [ ] Check the Python versions supported by the new GemsPy release',
              '',
              '### Decision',
              `- [ ] Approve version - run \`uv add "gemspy==${latest}"\` to update \`pyproject.toml\` and \`uv.lock\``,
              '- [ ] Reject version - close this issue with explanation',
              '',
              '---',
              '',
              '## Notes',
              '',
              '_Add findings and observations here._',
            ].join('\n');

            const result = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
            });

            core.setOutput('issue_number', String(result.data.number));
            core.setOutput('new_issue', 'true');
            console.log(`Issue created: #${result.data.number} - ${result.data.html_url}`);

  test-new-version:
    name: Tests against GemsPy v${{ needs.check-update.outputs.latest_version }} (Python ${{ matrix.python-version }})
    needs: check-update
    if: needs.check-update.outputs.new_issue == 'true'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies with GemsPy v${{ needs.check-update.outputs.latest_version }}
        run: uv add "gemspy==${{ needs.check-update.outputs.latest_version }}"

      - name: Run tests
        run: uv run pytest tests/ -v

      - name: Run Mypy type checking
        if: matrix.python-version == '3.11'
        run: |
          uv run mypy gems_views_builder
          uv run mypy tests

  post-results:
    name: Post test results to issue
    runs-on: ubuntu-22.04
    needs: [check-update, test-new-version]
    if: always() && needs.check-update.outputs.new_issue == 'true'

    steps:
      - name: Post results to issue
        uses: actions/github-script@v9
        env:
          TEST_RESULT: ${{ needs.test-new-version.result }}
          LATEST_VERSION: ${{ needs.check-update.outputs.latest_version }}
          ISSUE_NUMBER: ${{ needs.check-update.outputs.issue_number }}
        with:
          script: |
            const result = process.env.TEST_RESULT;
            const version = process.env.LATEST_VERSION;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const icon = result === 'success' ? '✅' : '❌';
            const status = result === 'success' ? 'passed' : result === 'failure' ? 'failed' : `did not complete (${result})`;

            const body = [
              `## Test Results — GemsPy v${version}`,
              '',
              `${icon} Tests (Python 3.11 to 3.14) and type checking **${status}** against GemsPy v${version}.`,
              '',
              `[View full run](${runUrl})`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              body: body,
            });
