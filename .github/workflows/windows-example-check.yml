# Temporary: checks that examples/antares_legacy works on Windows.
name: Windows example check

on:
  push:
    branches: ["claude/loving-allen-hp4qqx"]

jobs:
  windows-example:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: examples/antares_legacy

    steps:
      - name: Check out with Windows line endings, as a Windows user would
        working-directory: .
        run: git config --global core.autocrlf true

      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the ViewsBuilder
        working-directory: .
        run: uv sync

      - name: README command in PowerShell 7
        shell: pwsh
        run: |
          $env:PATH = "$env:GITHUB_WORKSPACE\.venv\Scripts;$env:PATH"
          mkdir output/area
          gems-views-builder `
            --system system-for-views.yml `
            --libraries-dir libraries `
            --taxonomy antares_legacy_taxonomy_flattened.yml `
            --catalogs-dir catalogs `
            --calendar calendar.csv `
            --simulation-tables "simulation_tables/simulation-table-*-optim-nb-2.parquet" `
            --view-config view_config_area.yml `
            --output output/area `
            --output-format csv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem output/area
          Remove-Item -Recurse output

      - name: README command in Windows PowerShell 5.1
        shell: powershell
        run: |
          $env:PATH = "$env:GITHUB_WORKSPACE\.venv\Scripts;$env:PATH"
          mkdir output/area
          gems-views-builder `
            --system system-for-views.yml `
            --libraries-dir libraries `
            --taxonomy antares_legacy_taxonomy_flattened.yml `
            --catalogs-dir catalogs `
            --calendar calendar.csv `
            --simulation-tables "simulation_tables/simulation-table-*-optim-nb-2.parquet" `
            --view-config view_config_area.yml `
            --output output/area `
            --output-format csv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem output/area
          Remove-Item -Recurse output

      - name: run_example.py
        run: uv run python run_example.py

      - name: Annual sums of the views (to compare with Linux)
        shell: bash
        env:
          PYTHONUTF8: "1"  # polars prints its tables with box-drawing characters
        run: |
          cat > "$RUNNER_TEMP/sums.py" <<'EOF'
          import glob
          import polars as pl
          pl.Config.set_tbl_rows(60)
          pl.Config.set_tbl_width_chars(200)
          pl.Config.set_fmt_float("full")
          for view in ("area", "link"):
              hourly = pl.read_csv(glob.glob(f"output/{view}/view_hour_*.csv")[0])
              daily = pl.read_csv(glob.glob(f"output/{view}/view_day_*.csv")[0])
              print(view, "hourly rows", hourly.height, "daily rows", daily.height)
              print(
                  hourly.filter(pl.col("scenario_id") == 0)
                  .group_by("metric_id", "metric_location", "breakdown_properties")
                  .agg(pl.col("metric_value").sum().round(1))
                  .sort("metric_id", "metric_location", "breakdown_properties")
              )
          EOF
          uv run python "$RUNNER_TEMP/sums.py"

      - name: Regenerate the inputs with Antares 10.2.0 for Windows
        shell: pwsh
        run: |
          curl.exe -sSL -f -o "$env:RUNNER_TEMP\antares.zip" https://github.com/AntaresSimulatorTeam/Antares_Simulator/releases/download/v10.2.0/antares-10.2.0-win64.zip
          Expand-Archive "$env:RUNNER_TEMP\antares.zip" -DestinationPath $env:RUNNER_TEMP
          uv run --no-project --python 3.12 --with antares-craft==0.17.1 python generate_inputs.py "$env:RUNNER_TEMP/antares-10.2.0-win64/bin/antares-solver.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git status --porcelain
          git diff --stat
