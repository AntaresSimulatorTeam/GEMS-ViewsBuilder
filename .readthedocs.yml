# Read the Docs configuration file for MkDocs projects
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details
version: 2

build:
  os: ubuntu-22.04
  tools:
    # RTD only accepts major.minor here. The docs are actually built with the
    # uv-managed 3.13.18 interpreter below, which includes the ssl denylist for
    # the compromised eMudhra/emSign intermediates:
    # https://discuss.python.org/t/109576
    python: "3.13"
  jobs:
    create_environment:
      # uv >= 0.13.6 is required for the emSign fix; keep in sync with CI.
      - asdf plugin add uv
      - asdf install uv 0.13.7
      - asdf global uv 0.13.7
      - uv python install 3.13.18
    install:
      - UV_PROJECT_ENVIRONMENT=$READTHEDOCS_VIRTUALENV_PATH uv sync --frozen --python 3.13.18 --extra doc

mkdocs:
  configuration: mkdocs.yml
  fail_on_warning: true
